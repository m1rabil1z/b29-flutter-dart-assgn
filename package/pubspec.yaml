name: image_color_extractor
description: "A standalone Dart engine for parsing raw image byte data and calculating dominant color coordinates."
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        nullsafety: true
      web:
        nullsafety: true